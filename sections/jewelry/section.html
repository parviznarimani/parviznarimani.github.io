<section class="section jewelry" id="jewelry">
    <div class="jewelry-head reveal">
        <div><span class="section-label">Gold &amp; Jewelry Profession</span><h2 class="display">Eternal Light</h2></div>
        <p class="lead jewelry-description" data-source="sections/jewelry/jewelryDirectionAbout.txt">{{JEWELRY_DESCRIPTION}}</p>
    </div>
    <div class="jewelry-carousel reveal" role="region" aria-roledescription="carousel" aria-label="Jewelry concepts">
        <div class="jewelry-stage" tabindex="0" aria-label="Jewelry slides. Use left and right arrow keys to browse.">
            <article class="jewel j1" data-position="left" role="group" aria-roledescription="slide" aria-label="1 of 3: Luxury Contents"><div class="jewel-image"><img src="sections/jewelry/medias/Image1.png" alt="Jewelry design — Luxury Contents" loading="lazy"></div><h3>Luxury Contents</h3></article>
            <article class="jewel j2" data-position="center" role="group" aria-roledescription="slide" aria-label="2 of 3: Brand Awareness"><div class="jewel-image"><img src="sections/jewelry/medias/Image2.png" alt="Jewelry design — Brand Awareness" loading="lazy"></div><h3>Brand Awareness</h3></article>
            <article class="jewel j3" data-position="right" role="group" aria-roledescription="slide" aria-label="3 of 3: Visual Campaign"><div class="jewel-image"><img src="sections/jewelry/medias/Image3.png" alt="Jewelry design — Visual Campaign" loading="lazy"></div><h3>Visual Campaign</h3></article>
        </div>
        <div class="jewelry-controls" hidden>
            <button type="button" class="jewelry-prev" aria-label="Previous jewelry slide">←</button>
            <div class="jewelry-dots" aria-label="Choose a jewelry slide">
                <button type="button" data-slide="0" aria-label="Show Luxury Contents" aria-pressed="false"></button>
                <button type="button" data-slide="1" aria-label="Show Brand Awareness" aria-pressed="true"></button>
                <button type="button" data-slide="2" aria-label="Show Visual Campaign" aria-pressed="false"></button>
            </div>
            <button type="button" class="jewelry-next" aria-label="Next jewelry slide">→</button>
        </div>
        <p class="sr-only jewelry-status" aria-live="polite" aria-atomic="true">Brand Awareness, slide 2 of 3</p>
    </div>
    <div class="jewelry-action"><a class="jewelry-learn-more" href="pages/jewelry/index.html">Learn More</a></div>
</section>
